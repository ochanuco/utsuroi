name: Publish Home Runner

on:
  push:
    branches: [main]
    paths:
      - 'executors/home-runner/**'
      - 'executors/shared/**'
      - 'executors/.dockerignore'
      - '.github/workflows/publish-home-runner.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-home-runner
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ochanuco/utsuroi-runner

jobs:
  publish:
    # workflow_dispatch を他ブランチから実行しても公開しない。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: executors/home-runner/package-lock.json

      - name: Test
        working-directory: executors/home-runner
        run: |
          npm ci
          npm test

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: executors
          file: executors/home-runner/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: GIT_SHA=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.tags.outputs.short }}
            ${{ env.IMAGE }}:latest
