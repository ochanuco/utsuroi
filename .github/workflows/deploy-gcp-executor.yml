name: Deploy GCP Executor

on:
  workflow_dispatch:
    inputs:
      ref:
        description: デプロイする ref（main、または main 上のコミット SHA）
        required: true
        default: main

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-gcp-executor
  cancel-in-progress: false

env:
  PROJECT: chanukott
  REGION: asia-northeast1
  SERVICE: utsuroi-gcp-http
  IMAGE_BASE: asia-northeast1-docker.pkg.dev/chanukott/utsuroi/gcp-http

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 承認は GitHub の Environment `production` の Required reviewers で行う
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: ref guard
        env:
          REF: ${{ inputs.ref }}
        run: |
          case "$REF" in
            main | refs/heads/main) sha=$(git rev-parse HEAD) ;;
            *)
              if ! sha=$(git rev-parse --verify --quiet "${REF}^{commit}") || ! git merge-base --is-ancestor "$sha" HEAD; then
                echo "::error::ref は main か、main 上のコミット SHA だけを指定できる: $REF"
                exit 1
              fi
              ;;
          esac
          git checkout --quiet "$sha"
          echo "SHA=$sha" >> "$GITHUB_ENV"
          echo "deploying \`$sha\` to production" >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: executors/gcp-http/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: executors/gcp-http/pnpm-lock.yaml

      - name: Test
        working-directory: executors/gcp-http
        run: |
          pnpm install --frozen-lockfile
          pnpm test

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/75594630387/locations/global/workloadIdentityPools/github/providers/utsuroi
          service_account: utsuroi-deploy@chanukott.iam.gserviceaccount.com

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ env.IMAGE_BASE }}:${{ env.SHA }}
        run: |
          docker build --file executors/gcp-http/Dockerfile --tag "$IMAGE" executors
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ env.IMAGE_BASE }}:${{ env.SHA }}
        run: |
          # PEM は改行を含むため --set-env-vars ではなく env-vars-file (JSON は YAML のサブセット) で渡す。
          jq -Rs '{EXECUTOR_PUBLIC_KEY: .}' executors/gcp-http/public-key.pem > "$RUNNER_TEMP/executor-env.json"
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT" \
            --service-account utsuroi-run@chanukott.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --ingress all \
            --concurrency 8 \
            --max-instances 3 \
            --memory 512Mi \
            --timeout 60 \
            --env-vars-file "$RUNNER_TEMP/executor-env.json" \
            --quiet
